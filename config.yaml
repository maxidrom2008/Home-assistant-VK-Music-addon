name: VK Music Server
version: "0.1.2"
slug: vk_music_server
description: Standalone VK Music server with persistent VK login, library and streaming
url: https://github.com/maxidrom2008/Home-assistant-VK-Music-addon
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
audio: true
ingress: true
ingress_port: 8099
panel_icon: mdi:music
panel_title: VK Music
map:
  - data:rw
watchdog: http://[HOST]:[PORT:8099]/health
